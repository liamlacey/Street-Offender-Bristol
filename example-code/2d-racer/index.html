<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>2D Racer</title>
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <!-- Add to Home Screen: launches full screen, without the browser's toolbars. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="2D Racer" />
    <meta name="theme-color" content="#1b1f24" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1f24; overflow: hidden; }
      /* Stop phones scrolling, zooming or selecting text while you hold the buttons. */
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      /* Keep the game clear of notches and home indicators. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
